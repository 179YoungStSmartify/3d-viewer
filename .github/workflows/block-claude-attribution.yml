name: Block Claude attribution

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  block-claude-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fail on Claude or Anthropic attribution
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/block_claude_attribution.py "$HEAD_SHA" --not "$BASE_SHA"
