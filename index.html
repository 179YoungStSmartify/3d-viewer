/* Layout: full-bleed 3D canvas, schedule panel docked right (bottom sheet on phones), toolbar top-left. Single dark look, like the switchboard drawing at night. */
:root{

}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-ui)}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100% - 24px - min(360px,40%));background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px;backdrop-filter:blur(6px)}
.bar .name{font-weight:700;letter-spacing:.02em;padding:0 6px}
button{font:500 13px/1 var(--f-ui);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer}
button:hover{border-color:#41526a}
button:focus-visible{outline:2px solid var(--warm);outline-offset:1px}
button.on{background:#2b3a4f;border-color:#5b7697}
.panel{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:12px;width:min(360px,40%);display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:blur(6px)}
.ph{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.ph h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.ph .sub{color:var(--muted);font-size:12px}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font:600 18px var(--f-mono)}
.stats span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 9px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.list{overflow:auto;padding:6px 8px 12px;flex:1;min-height:0}
.plate{border:1px solid transparent;border-radius:9px;padding:8px;display:grid;gap:6px}
.plate.sel{border-color:#5b7697;background:var(--panel-2)}
.plate.dim{opacity:.32}
.ptop{display:flex;align-items:center;gap:8px;cursor:pointer}
.ptop .room{font-weight:600}
.ptop .loc{color:var(--muted);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gang{font:500 11px var(--f-mono);padding:2px 6px;border-radius:5px;color:#0f141b}
.gangs{display:flex;flex-wrap:wrap;gap:5px}
.gbtn{font-size:12px;padding:6px 8px;display:inline-flex;gap:6px;align-items:center;text-align:left}
.gbtn .led{width:7px;height:7px;border-radius:50%;background:#3a4656;flex:none}
.gbtn.lit{border-color:#8a6a2c;background:#2e2717}
.gbtn.lit .led{background:var(--warm);box-shadow:0 0 6px var(--warm)}
.tw{font:500 10px var(--f-mono);color:var(--link);border:1px solid #556377;border-radius:4px;padding:1px 4px}
.tip{position:fixed;pointer-events:none;background:#0b0f15;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px;z-index:5}
.tip b{display:block}
.legend{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--muted);font-size:12px;max-width:calc(100% - 24px - min(360px,40%))}

.load{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font:500 14px var(--f-mono)}

  .bar{max-width:calc(100% - 24px)}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function radial(inner, outer) {

}

// ---------------------------------------------------------------- plates
const pickables = [];

function buildPlate(p, idx) {

  const ringMat = new THREE.MeshBasicMaterial({ color: GANG_COL[n] });

  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.014), new THREE.MeshStandardMaterial({ color: '#f3f4f2', roughness: .5 }));

  const btns = [];

    const b = new THREE.Mesh(new THREE.BoxGeometry(gw - 0.008, h - 0.03, 0.01), bm); b.position.set(bx, -0.005, 0.011);
    b.userData = { plate: idx, gang: i, cid }; g.add(b); pickables.push(b);

    const led = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.005, 0.004), ledMat); led.position.set(bx, h / 2 - 0.012, 0.017); g.add(led);

let plates = [];

// wiring: curve from plate to each load of a circuit on the same level

// ---------------------------------------------------------------- loading
function inRect(p, r) { return p.x >= r[0] && p.x <= r[2] && p.z >= r[1] && p.z <= r[3]; }
function attachLoads(level) {
  const lights = [];
  levels[level].root.traverse(o => {
    if (o.name?.startsWith('switch_')) o.visible = false;
    if (o.isMesh && o.name?.startsWith('light_')) lights.push(o);
  });
  const taken = new Set();
  for (const [cid, [, loads]] of Object.entries(CIR)) {
    for (const ld of loads) {
      const [lv, kind, ...a] = ld; if (lv !== level) continue;
      const push = (fx, pt) => { fx.pt = pt; circuits[cid].objs.push(fx); };
      if (kind === 'L' || kind === 'P' || kind === 'F') {
        for (const m of lights) {
          if (taken.has(m)) continue;
          const isP = m.name.startsWith('light_pendant_'), isF = /^light_(garden|pool)_/.test(m.name);
          if ((kind === 'P') !== isP || (kind === 'F') !== isF) continue;
          const p = m.getWorldPosition(new THREE.Vector3()); if (!inRect(p, a)) continue;
          taken.add(m); push(fxDownlight(level, m, kind), p);
        }
      } else if (kind === 'fan' || kind === 'exh') push(fxFan(level, a[0], a[1], kind === 'exh'), new THREE.Vector3(a[0], kind === 'exh' ? 3.0 : 2.75, a[1]));
      else if (kind === 'strip') { const [x0, z0, x1, z1, y] = a; push(fxBar(level, new THREE.BoxGeometry(Math.abs(x1 - x0) || 0.03, 0.02, Math.abs(z1 - z0) || 0.03), new THREE.Vector3((x0 + x1) / 2, y, (z0 + z1) / 2)), new THREE.Vector3((x0 + x1) / 2, y, (z0 + z1) / 2)); }
      else if (kind === 'box') { const [x0, y0, z0, x1, y1, z1] = a; const c = new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); push(fxBar(level, new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), c), c); }
      else if (kind === 'mir') push(fxMirror(level, a[0], a[1], a[2], a[3]), new THREE.Vector3(a[0], 1.95, a[1]));
      else if (kind === 'wall') push(fxWallLight(level, a[0], a[1], a[2], a[3]), new THREE.Vector3(a[0], 2.2, a[1]));
      else if (kind === 'flood') push(fxFlood(level, a[0], a[1], a[2], a[3]), new THREE.Vector3(a[0], 2.6, a[1]));

  if (missed.length) console.info(level, 'lights not on a circuit:', missed.map(m => m.name));
}

function setView(v) {
  state.view = v; const L = levels[state.level];
  const box = new THREE.Box3().setFromObject(L.root); box.max.y = 1.5; box.min.y = 0;
  const c = box.getCenter(new THREE.Vector3()); c.y = 0;
  const size = box.getSize(new THREE.Vector3());
  const el = THREE.MathUtils.degToRad(v === 'top' ? 70 : 44), az = THREE.MathUtils.degToRad(v === 'top' ? 0 : -24);
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  // fit the house into the part of the screen not covered by the panel, then shift the render with a view offset
  const W = app.clientWidth, H = app.clientHeight, wide = W > 760;
  const panelW = wide ? Math.min(360, W * 0.4) + 24 : 0, sheetH = wide ? 0 : H * 0.42 + 8;
  const fx = (W - panelW) / W * 0.94, fy = (H - sheetH - 60) / H * 0.9;
  camera.clearViewOffset();
  const pts = []; for (const x of [box.min.x, box.max.x]) for (const y of [0, box.max.y]) for (const z of [box.min.z, box.max.z]) pts.push(new THREE.Vector3(x, y, z));
  let d = 60;
  for (let i = 0; i < 6; i++) {
    camera.position.copy(c).addScaledVector(dir, d); camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let a = 1e9, b = -1e9, e = 1e9, f = -1e9;
    for (const p of pts) { const q = p.clone().project(camera); a = Math.min(a, q.x); b = Math.max(b, q.x); e = Math.min(e, q.y); f = Math.max(f, q.y); }
    const rv = new THREE.Vector3((a + b) / 2, (e + f) / 2, 0.5).unproject(camera).sub(camera.position).normalize();
    const hit = camera.position.clone().addScaledVector(rv, -camera.position.y / rv.y); c.copy(hit); c.y = 0;
    d *= Math.max((b - a) / 2 / fx, (f - e) / 2 / fy);
  }
  camera.setViewOffset(W, H, panelW / 2, sheetH / 2 - 20, W, H);
  camera.position.copy(c).addScaledVector(dir, d); controls.target.copy(c); controls.update();
  document.getElementById('v-top').classList.toggle('on', v === 'top'); document.getElementById('v-ang').classList.toggle('on', v === 'angled');
}

// ---------------------------------------------------------------- picking
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); const tip = document.getElementById('tip');
let down = null, hovered = null;
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const vis = pickables.filter(m => plates[m.userData.plate].level === state.level);
  return ray.intersectObjects(vis, false)[0]?.object;
}
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return; down = null;
  const o = pick(e); if (!o) { if (state.sel) select(null); return; }
  const pl = plates[o.userData.plate];
  if (o.userData.cid) setCircuit(o.userData.cid, !circuits[o.userData.cid].on);
  select(pl, false);
});
renderer.domElement.addEventListener('pointermove', e => {
  const o = pick(e); renderer.domElement.style.cursor = o ? 'pointer' : '';
  if (!o) { tip.hidden = true; hovered = null; return; }
  const pl = plates[o.userData.plate]; hovered = pl;
  const g = o.userData.cid ? circuits[o.userData.cid] : null;
  tip.innerHTML = `<b>${pl.room} · ${pl.gangs.length}-gang</b>${pl.loc}<br>` + (g ? `${g.name}${TWO_WAY.has(g.id) ? ' (2-way)' : ''} · <b style="display:inline;color:${g.on ? '#ffc66b' : '#93a1b3'}">${g.on ? 'ON' : 'OFF'}</b>` : 'Click a button to switch');
  tip.hidden = false; tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});

// ---------------------------------------------------------------- toolbar
document.getElementById('lv-gf').onclick = () => { state.level = 'gf'; state.sel = null; applyLevel(); setView(state.view); };
document.getElementById('lv-ff').onclick = () => { state.level = 'ff'; state.sel = null; applyLevel(); setView(state.view); };
document.getElementById('v-top').onclick = () => setView('top');
document.getElementById('v-ang').onclick = () => setView('angled');
document.getElementById('night').onclick = () => { state.night = !state.night; applyNight(); };
document.getElementById('wires').onclick = (e) => { state.allWires = !state.allWires; e.currentTarget.classList.toggle('on', state.allWires); refreshWires(); };
document.getElementById('labels').onclick = (e) => { state.labels = !state.labels; e.currentTarget.classList.toggle('on', state.labels); for (const k of ['gf', 'ff']) levels[k].labels.visible = state.labels; };
document.getElementById('alloff').onclick = () => { for (const c of Object.values(circuits)) if (c.on) { c.on = false; c.target = 0; for (const pl of c.plates) pl.btns.forEach(b => { if (b.cid === c.id) { b.ledMat.color.set('#4aa3ff'); b.bm.color.set('#e2e5e9'); b.b.position.z = 0.011; } }); } refreshWires(); renderList(); };
applyNight();

// ---------------------------------------------------------------- loop
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function resize() { const w = app.clientWidth, h = app.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', () => { resize(); if (plates.length) setView(state.view); }); resize();
function render() {
  renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (const c of Object.values(circuits)) for (const o of c.objs) { const next = reduce ? c.target : o.k + (c.target - o.k) * Math.min(1, dt * 7); if (Math.abs(next - o.k) > 1e-3 || next !== o.k) { o.k = Math.abs(c.target - next) < 1e-3 ? c.target : next; o.set(o.k); } }
    if (!reduce) for (const f of anim) f(dt);
    if (fly) { const t = Math.min(1, (now - fly.t0) / 700), s = t * t * (3 - 2 * t); controls.target.lerpVectors(fly.fromT, fly.toT, s); camera.position.lerpVectors(fly.fromP, fly.toP, s); if (t >= 1) fly = null; }
    // pulse the selected plate's ring
    for (const pl of plates) { const s = pl === state.sel || pl === hovered ? 2.4 * (1.12 + 0.06 * Math.sin(now / 160)) : 2.4; pl.g.scale.setScalar(s); }
    controls.update(); renderer.render(scene, camera);
  });
}
window.__sw = { circuits, get plates() { return plates; }, setCircuit, setView, state, applyLevel, select };
</script>
